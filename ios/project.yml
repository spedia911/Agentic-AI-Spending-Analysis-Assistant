name: SpendingAssistant
options:
  bundleIdPrefix: com.spendingassistant
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  BASE_SDK: iphoneos
  SWIFT_VERSION: "5.9"
  TARGETED_DEVICE_FAMILY: "1"
packages:
  SpendingDomain:
    path: Packages/SpendingDomain
targets:
  SpendingAssistant:
    type: application
    platform: iOS
    sources:
      - path: SpendingAssistant
    resources:
      - path: SpendingAssistant/Resources/sample-extraction.json
      - path: SpendingAssistant/Resources/sample-balances.json
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.spendingassistant.app
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_FILE: SpendingAssistant/Resources/Info.plist
      CODE_SIGN_ENTITLEMENTS: SpendingAssistant/Resources/SpendingAssistant.entitlements
    dependencies:
      - package: SpendingDomain
      - target: ShareExtension
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.spendingassistant.app.share
      INFOPLIST_FILE: ShareExtension/Info.plist
      CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
  SpendingAssistantTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpendingAssistantTests
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SpendingAssistant
      - package: SpendingDomain
  SpendingAssistantUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SpendingAssistantUITests
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SpendingAssistant
schemes:
  SpendingAssistant:
    build:
      targets:
        SpendingAssistant: all
    run:
      config: Debug
      executable: SpendingAssistant
    profile:
      config: Release
      executable: SpendingAssistant
    test:
      config: Debug
      targets:
        - SpendingAssistantTests
        - SpendingAssistantUITests
